<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Jayant Singh Singoria</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F5F0E6;--ink:#211E1A;--plum:#7B2D55;--amber:#C1832F;--line:rgba(33,30,26,.16)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',monospace;text-align:center;padding:40px;
    background-image:radial-gradient(var(--line) .75px,transparent .75px);background-size:23px 23px}
  .box{max-width:520px;background:#FCFAF4;border:1px solid var(--line);padding:50px 40px;border-radius:10px;box-shadow:0 20px 50px -20px rgba(70,40,25,.3);transform:rotate(-1deg)}
  .num{font-family:'Fraunces',Georgia,serif;font-size:clamp(6rem,18vw,10rem);line-height:.9;font-weight:600;letter-spacing:-.07em;color:var(--plum);margin:0}
  .star{color:var(--amber);font-size:1.4rem}
  h1{font-family:'Fraunces',Georgia,serif;font-size:1.8rem;font-weight:600;letter-spacing:-.03em;margin:16px 0 8px}
  p{color:#4C463D;font-size:.86rem;line-height:1.7;margin:0 0 26px}
  a{display:inline-block;background:var(--plum);color:#FFF7F0;padding:12px 24px;border-radius:100px;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;transition:transform .2s}
  a:hover{transform:translateY(-3px)}
  @media (prefers-color-scheme:dark){:root{--paper:#16130F;--ink:#F4EEDF;--plum:#E5A2C4;--line:rgba(244,238,223,.14)}.box{background:#211D17}p{color:#CEC3B0}a{color:#20131B}}
</style>
</head>
<body>
  <div class="box">
    <p class="num">404</p>
    <p class="star">✳</p>
    <h1>This page went missing.</h1>
    <p>Either the URL is wrong, or I moved something while tinkering. Either way, the front door still works.</p>
    <a href="/">Back to the site →</a>
  </div>
</body>
</html>
